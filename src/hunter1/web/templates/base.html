<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Hunter1{% endblock %} · Hunter1</title>
    <style>
      :root {
        --ink: #1f2328;
        --muted: #6b7280;
        --line: #e5e7eb;
        --bg: #f7f8fa;
        --card: #ffffff;
        --accent: #2563eb;
        --ok: #15803d;
        --bad: #b91c1c;
        --warn: #b45309;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .topbar {
        display: flex; align-items: center; gap: 24px;
        padding: 0 24px; height: 52px;
        background: var(--card); border-bottom: 1px solid var(--line);
        position: sticky; top: 0; z-index: 10;
      }
      .brand { font-weight: 700; letter-spacing: .3px; }
      .brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
      nav { display: flex; gap: 18px; }
      nav a { color: var(--muted); padding: 4px 0; border-bottom: 2px solid transparent; }
      nav a.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
      main { max-width: 1080px; margin: 24px auto 64px; padding: 0 24px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 16px; margin: 24px 0 8px; }
      .sub { color: var(--muted); margin: 0 0 20px; }
      .card {
        background: var(--card); border: 1px solid var(--line);
        border-radius: 8px; padding: 16px; margin-bottom: 16px;
      }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: none; }
      tr:last-child td { border-bottom: none; }
      .muted { color: var(--muted); }
      .tag {
        display: inline-block; padding: 1px 7px; border-radius: 999px;
        background: #eef2ff; color: #3730a3; font-size: 12px;
      }
      .tag.warn { background: #fef3c7; color: var(--warn); }
      .tag.bad { background: #fee2e2; color: var(--bad); }
      .tag.ok { background: #dcfce7; color: var(--ok); }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      input[type="text"], input[type="number"], select, textarea {
        font: inherit; padding: 6px 9px;
        border: 1px solid var(--line); border-radius: 6px; background: #fff;
      }
      input[type="text"]:focus, select:focus, textarea:focus {
        outline: 2px solid #bfdbfe; border-color: var(--accent);
      }
      textarea { width: 100%; resize: vertical; min-height: 72px; }
      button {
        font: inherit; padding: 7px 14px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--line); background: #fff; color: var(--ink);
      }
      button:hover { border-color: #cbd5e1; background: #f9fafb; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { background: #1d4ed8; }
      button.danger { color: var(--bad); }
      form.inline { display: inline; }
      .banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
      .banner.ok { background: #dcfce7; color: #14532d; }
      .banner.bad { background: #fee2e2; color: #7f1d1d; }
      .banner.info { background: #e0f2fe; color: #075985; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .grid2 label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      .grid2 input, .grid2 select { width: 100%; }
      .pager { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
      .chat { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
      .conv-list { list-style: none; padding: 0; margin: 0; }
      .conv-list li { padding: 6px 8px; border-radius: 6px; }
      .conv-list li.on { background: #eef2ff; }
      .conv-list a { color: var(--ink); }
      .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; white-space: pre-wrap; }
      .msg.user { background: #eff6ff; }
      .msg.assistant { background: var(--card); border: 1px solid var(--line); }
      .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      .empty { color: var(--muted); padding: 24px 0; text-align: center; }
      code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Hunter1 <small>求职工作台</small></div>
      <nav>
        <a href="/" class="{% if active == 'jobs' %}on{% endif %}">岗位库</a>
        <a href="/applications" class="{% if active == 'applications' %}on{% endif %}">投递</a>
        <a href="/assistant" class="{% if active == 'assistant' %}on{% endif %}">助手</a>
        <a href="/crawl" class="{% if active == 'crawl' %}on{% endif %}">抓取</a>
        <a href="/settings" class="{% if active == 'settings' %}on{% endif %}">配置</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
