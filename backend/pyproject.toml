[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter1"
# 版本号只有一个来源：src/hunter1/__init__.py 的 __version__。
# 不在这里再写一份 —— 两份靠人工同步时，「改了这边忘了那边」不会报任何错，
# 只会让自更新的版本判断长期失准。见 tests/test_version.py。
dynamic = ["version"]
description = "求职工作台：轻量 · 跨平台 · 零托管"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Web UI：FastAPI + ASGI 服务器。
# SSR 模板层已移除（前端是独立 SPA，产物由 main.py 直接服务），因此不再需要
# jinja2；请求体一律走 JSON（pydantic BaseModel），也没有表单上传，故
# python-multipart 一并去掉。
# uvicorn 不取 [standard]：那是给生产部署用的加速件，本地单用户工具用不上，
# 且在 Windows 上大部分装不了，徒增安装失败面。
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
db = ["sqlalchemy>=2.0,<3"]
crawler = ["beautifulsoup4>=4.12", "lxml>=5.0"]
browser = ["playwright>=1.48"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1",
]
# 打包用。刻意不并进 dev：CI 只跑质量门禁、不构建产物，装了纯属拖慢。
build = ["pyinstaller>=6.0"]

[project.scripts]
hunter1 = "hunter1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hunter1"]

[tool.hatch.version]
path = "src/hunter1/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# `.rivet/` 是协作框架的本地工作区（会话备份、临时探针），不是项目源码；
# 它的内容会随会话变动，扫进来只会制造噪音。
extend-exclude = [".rivet"]

[tool.ruff.lint]
# 基础规则集：错误/未用导入/导入排序/命名/现代语法/bugbear/简化/Ruff 专有
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 = "歧义 Unicode 字符"（形近字符混用），本意是防英文里的
# 全角/形近字符误用。本项目注释与文档为中文，全角标点是有意使用，故忽略。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# ⚠️ 为什么必须显式写 `known-first-party`：上面 `src = ["src", "tests"]` 是
# **相对进程 cwd** 解析的，不是相对本文件 —— `--config` 传绝对路径也不改变
# 这一点（实测 `--show-settings`）：
#   cwd=backend  → linter.src = ["<repo>/backend/src", "<repo>/backend/tests"] → hunter1 判 first-party
#   cwd=仓库根   → linter.src = []                                           → hunter1 判 third-party
# 后果是**同一个 import 块的合法性随调用者所在目录翻转** —— 同一个 import 块，
# 在 backend/ 下判 first-party、在仓库根下判 third-party。
# 实测差距：scripts/refresh_fixtures.py 的 `from bs4 import ...` 与
# `from hunter1...` 连排，backend 下报 I001、仓库根下 All checks passed。
#
# 钉住归属即可消除漂移：scripts/ 里的脚本都先 `sys.path.insert(.../backend/src)`
# 再 import hunter1（见 refresh_fixtures.py:26），语义上就是本方包 ——
# 不因从哪个目录调用而改变。对 backend 自身的检查无影响（那里 hunter1 本就是
# first-party，此项只是把隐式判定写成显式的）。
known-first-party = ["hunter1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 允许不安装即可从 src 导入（配合 `pip install -e .` 双保险）；"." 让 tests 包可导入
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/hunter1"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# 本机自带解释器是 Python **embeddable** 版（`.tools/python`）：pyright 自动探测
# 时拿不到它的 site-packages，会把已装好的 pydantic / fastapi / sqlalchemy 等
# 全报成 `Import ... could not be resolved` —— 是**假错**，不是依赖缺失
# （同一个环境里 pytest 能全绿跑完）。实测：裸跑 pyright 39 条假错，
# 补上本项后归零。
#
# 路径是**仓库相对**（相对本文件所在目录 `backend/`），不是机器绝对路径；
# 该目录不存在时 pyright 只是忽略这条搜索路径、不报错。
#
# ⚠️ 但**「多余但无害」这个假设被证伪过一次**（实测教训，别重蹈）：
# 本机 pyright 之所以顺手，一部分就靠这条路径直接指向本机 site-packages。
# 它把「`--pythonpath` 传了个解析不到的解释器」这类问题**掩盖掉了** ——
# CI 上 `.tools/` 不在仓库里、没有这条兜底，于是同一个配置报了 41 条
# `reportMissingImports`（httpx / pydantic / fastapi / bs4 全中），而本机 0 errors。
# 也就是说：**本机绿 ≠ CI 绿**，凡 pyright 相关改动都该意识到这层遮蔽。
#
# 与 check.sh 的关系：check.sh 用 `--pythonpath` 显式传解释器，本项对它是冗余的
# 双保险。本项的价值在于让**裸跑 `pyright` 与 IDE** 也能得到正确结果，避免
# 开发者把 39 条假错当成噪音而习惯性忽略真错误。
#
# `"src"` 这一项是给 **scripts/** 用的（见 check.sh 里那条对 scripts 的 pyright）：
# 脚本都在运行时 `sys.path.insert(.../backend/src)` 才能 import hunter1，pyright
# 读不懂那句动态插入，不给它搜索路径就会把 `from hunter1 import ...` 全报成
# `reportMissingImports`（实测 9 条假错）。对 backend 自身的检查无影响。
#
# `"../scripts"` 同理，为的是脚本之间互相 import（`build.py` / `gh_publish.py`
# 都要用 `artifact.py` 的产物命名）。不加这一项就得在每个 import 上挂
# `# pyright: ignore`，那会把真正的缺失依赖也一起静音掉。脚本名都足够独特
# （artifact / build / serve / make_manifest / export_openapi / refresh_fixtures），
# 不会遮蔽任何第三方包。
extraPaths = ["src", "../scripts", "../.tools/python/Lib/site-packages"]
