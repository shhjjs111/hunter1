name: Release

on:
  push:
    tags: ["v*"]

# 顶层不放任何权限：令牌只发给真正需要它的 job（见下方 permissions）。
permissions: {}

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.12.23"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出完整标签历史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: 安装 Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK
        # windows-latest 自带命令行工具；仓库只允许 GitHub 官方 Actions。
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          if (-not (Test-Path -LiteralPath $sdkManager)) {
            throw 'Windows runner 缺少 Android SDK 命令行工具'
          }
          & $sdkManager 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 校验 tag、版本与 main 祖先关系
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "uv==$UV_VERSION"
          uv sync --project backend --frozen --python 3.12.10 --extra dev --extra web --extra db --extra crawler --extra build
          PY="$(pwd)/backend/.venv/Scripts/python.exe"
          TAG="$GITHUB_REF_NAME"
          VERSION="$("$PY" -c "import sys; sys.path.insert(0, 'backend/src'); from hunter1 import __version__; print(__version__)")"
          test "$TAG" = "v$VERSION"
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
          test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          uv pip install --python "$PY" --index-url https://pypi.org/simple shellcheck-py==0.11.0.1

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 重建并执行完整门禁
        run: PY="$(pwd)/backend/.venv/Scripts/python.exe" bash scripts/check.sh --with-pack

      - name: 构建、签名并校验 Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?缺少 secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?缺少 secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?缺少 secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?缺少 secret ANDROID_KEY_PASSWORD}"
          VERSION="${GITHUB_REF_NAME#v}"
          trap 'rm -f "$RUNNER_TEMP/hunter1-release.jks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hunter1-release.jks"
          export HUNTER1_ANDROID_KEYSTORE="$RUNNER_TEMP/hunter1-release.jks"
          export HUNTER1_ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export HUNTER1_ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          export HUNTER1_ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          (cd frontend && npx cap sync android)
          (cd frontend/android && cmd //c gradlew.bat assembleRelease -PappVersion="$VERSION" --no-daemon)
          APK="frontend/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "dist/hunter1-android-$VERSION.apk"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          EXPECTED_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          PY="$(pwd)/backend/.venv/Scripts/python.exe"
          "$PY" scripts/verify_apk.py \
            --apk "dist/hunter1-android-$VERSION.apk" \
            --version "$VERSION" \
            --version-code "$EXPECTED_CODE"

      - name: 生成清单、SBOM、发布说明和校验和
        run: |
          set -euo pipefail
          PY="$(pwd)/backend/.venv/Scripts/python.exe"
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          PLATFORM="$("$PY" -c "import sys; sys.path.insert(0, 'scripts'); from artifact import platform_key; print(platform_key())")"
          ZIP="dist/$("$PY" -c "import sys; sys.path.insert(0, 'scripts'); from artifact import artifact_name; print(artifact_name())")"
          test -f "$ZIP"
          "$PY" scripts/make_manifest.py \
            --asset "$PLATFORM=$ZIP" \
            --url-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --version "$VERSION" \
            --out dist/manifest.json
          "$PY" scripts/make_sbom.py --output dist/sbom.spdx.json \
            --artifact "hunter1-win32=$ZIP" \
            --artifact "hunter1-android=dist/hunter1-android-$VERSION.apk"
          "$PY" scripts/release_notes.py --version "$VERSION" --out dist/release-notes.md
          (
            cd dist
            sha256sum "$(basename "$ZIP")" "hunter1-android-$VERSION.apk" manifest.json sbom.spdx.json > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: 上传待签名/发布的构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            dist/hunter1-win32.zip
            dist/*.apk
            dist/manifest.json
            dist/sbom.spdx.json
            dist/SHA256SUMS.txt
            dist/release-notes.md

  attest:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: 取回构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/hunter1-win32.zip
            dist/*.apk
            dist/manifest.json
            dist/sbom.spdx.json
            dist/SHA256SUMS.txt

      - name: 生成 SBOM 证明
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/hunter1-win32.zip
            dist/*.apk
          sbom-path: dist/sbom.spdx.json

  publish:
    needs: [build, attest]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash

    steps:
      - name: 取回构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: 创建草稿、上传资产并核对
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" = "true" ]; then
              gh release delete "$TAG" --yes --cleanup-tag=false
            else
              echo "::error::$TAG 已发布；不可变 release 不允许覆盖"
              exit 1
            fi
          fi
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "Hunter1 $TAG" \
            --notes-file dist/release-notes.md
          gh release upload "$TAG" \
            dist/hunter1-win32.zip \
            dist/hunter1-android-*.apk \
            dist/manifest.json \
            dist/sbom.spdx.json \
            dist/SHA256SUMS.txt
          COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          test "$COUNT" = "5"
          echo "::notice::$TAG 草稿已创建（5 个自动资产：Windows 包、APK、清单、SBOM、校验和）。核对后手动发布。"
