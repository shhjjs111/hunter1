name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.12.23"

# 同一分支连推多次时，取消**仍在排队/运行**的旧 run，只保留最新的。
#
# 为什么必需：本 workflow 一次要真打包（PyInstaller，数分钟），而提交常常连着来。
# 没有这一条时实测出现「同一分支 3 个 run 同时 in_progress」—— 它们互相抢
# windows runner 配额，既拖慢最新那次，也在 Actions 页面上制造噪音。
#
# `github.ref` 对 push 是分支、对 PR 是 refs/pull/<n>/merge，两组各自独立取消，
# 不会出现「PR 的 run 把 main 的 run 杀了」。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # 硬超时。**默认值（360 分钟 = 6 小时）太长了**，实测吃过一次：
    # 一个卡住的 job 静默烧满 6 小时才被 GitHub 取消，期间只看到 Actions 一直
    # 转圈，且日志里没有失败信息（pytest 的进度点停在原地）。
    #
    # 25 分钟的依据：正常一次全量（含 --with-pack 真打包）在本机约 2~4 分钟，
    # windows runner 冷启动 + 装依赖约 3~5 分钟，总余量充足。
    # 超时会让 job 以 failure 结束 —— 这比「转 6 小时」好得多：失败是**信号**，
    # 转圈是**噪音**。真需要更久时调大这个数字，而不是删掉它。
    timeout-minutes: 25

    # 跑在 **windows-latest**，不是 ubuntu —— 当前交付目标只有 Windows 便携包。
    #
    # 为什么这不是「退让」而是**更强的**门禁：门禁跑在**用户所在的平台**才拦得住
    # 用户会遇到的缺陷。本项目吃过两次「CI 绿、Windows 红」：GBK 子进程解码（P0）
    # 与 node 包装器导致的打包失败 —— 两者在 ubuntu runner 上都不复现，于是
    # 「本机红、CI 绿」长期并存。跑 Windows 后，这两类**只此一地**能暴露的缺陷
    # 会被 CI 当场拦下。
    #
    # 顺带消掉一个我不再能回避的问题：CI 与开发机同平台 ⇒ CI 跑的就是开发机跑的
    # 那条命令，本地可复现（此前 ubuntu 上的行为在本机根本跑不出来）。
    runs-on: windows-latest
    # Windows runner 的 `run:` 默认走 pwsh；本项目所有脚本是 bash。统一成 bash
    # （Git Bash，runner 自带），与开发机的 Git Bash 同源 —— 路径/glob/引号行为一致。
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 历史卫生守卫要扫描全部可达提交；默认 depth=1 会让它静默失去覆盖。
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 uv
        run: python -m pip install --disable-pip-version-check "uv==$UV_VERSION"

      - name: 安装锁定的后端依赖
        # `--frozen` 拒绝任何 lock 漂移；`--extra` 与门禁覆盖范围一一对应。
        # build extra 让 CI 真正产出并冒烟 Windows 包，而不是只检查 spec。
        run: >-
          uv sync
          --project backend
          --frozen
          --python 3.12
          --extra dev
          --extra web
          --extra db
          --extra crawler
          --extra build

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 安装 shellcheck
        # pip 装**与开发机同版本**的 shellcheck（shellcheck-py 自带二进制，有
        # win_amd64 wheel）。不用别处来源的理由是**版本漂移**：同一段
        # `A && B || C` 旧版报 SC2015、新版不报，版本不钉则「本机绿、CI 红」。
        #
        # 显式指定官方索引：本项目开发机默认 PIP_INDEX_URL 指向清华镜像，而清华
        # 未收录 shellcheck-py（见 docs/DEVELOPMENT.md）。CI 上无该变量，但写明更稳。
        # 装在哪个解释器里无关紧要：check.sh 会按 venv 布局从解释器路径反推
        # `<python>/Scripts/shellcheck.exe`（该目录不一定在 PATH 上）。
        run: >-
          uv pip install
          --python backend/.venv/Scripts/python.exe
          --index-url https://pypi.org/simple
          shellcheck-py==0.11.0.1

      - name: 全量门禁（ruff / pyright / pytest / 示例 / shellcheck / 前端 check+build / 契约漂移 / 打包+冒烟）
        # 直接调用本地同款脚本 —— CI 与开发机不可能再漂移（如今还同平台）。
        # 之前这里手写后端五步，漏了前端 `npm run check` 与 `contracts.sh --check`：
        # 「后端改了 API 模型忘了重跑 contracts.sh」能一路绿灯合入，契约静默断开。
        # check.sh 按目录存在性自动纳入各端检查，新增端时无需再改本文件。
        #
        # `--with-pack`：额外真打包 + 冒烟。这条路径此前完全在门禁之外（只编译
        # spec），实测 `build.py` 的前端烘焙已在其间烂掉（node 包装器导致本机
        # exit 1，门禁却绿）。默认关是为了不拖慢日常本机循环；CI 必开。
        run: PY="$(pwd)/backend/.venv/Scripts/python.exe" bash scripts/check.sh --with-pack
