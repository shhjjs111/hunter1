name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    name: 质量门禁 (lint + type + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 格式检查
        run: ruff format --check .

      - name: 静态检查
        run: ruff check .

      - name: 类型检查
        run: pyright

      - name: 测试
        run: pytest
