name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    name: 质量门禁（后端 + 前端 + 契约）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装后端依赖
        # 测试横跨 db / crawler / 各切片三层，必须把它们都装上：
        # 只装 .[dev] 的话，test_repository（sqlalchemy）、test_adapters（bs4）
        # 以及各切片的路由测试都会在收集阶段就 ImportError。
        run: pip install -e ".[dev,web,db,crawler]"
        working-directory: backend

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 安装 shellcheck
        # 用 pip 装**与开发机同版本**的 shellcheck（shellcheck-py 自带二进制，
        # 且有 manylinux wheel）。不用 apt 的理由是**版本漂移**：apt 的版本随
        # runner 镜像变，实测其 shellcheck 比 0.11.0 旧 —— 同一段 `A && B || C`
        # 旧版报 SC2015、新版不报，于是「本机绿、CI 红」。钉住版本才能让两边
        # 的判定一致。
        #
        # 显式指定官方索引：本项目开发机默认 PIP_INDEX_URL 指向清华镜像，而清华
        # 未收录 shellcheck-py（见 docs/DEVELOPMENT.md）。CI 上无该变量，但写明更稳。
        run: python -m pip install --index-url https://pypi.org/simple shellcheck-py==0.11.0.1

      - name: 全量门禁（ruff / pyright / pytest / 示例 / shellcheck / 前端 check+build / 契约漂移）
        # 直接调用本地同款脚本 —— CI 与开发机不可能再漂移。
        # 之前这里手写后端五步，漏了前端 `npm run check` 与 `contracts.sh --check`：
        # 「后端改了 API 模型忘了重跑 contracts.sh」能一路绿灯合入，契约静默断开。
        # check.sh 按目录存在性自动纳入各端检查，新增端时无需再改本文件。
        run: bash scripts/check.sh
