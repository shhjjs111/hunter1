name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    name: 质量门禁 (lint + type + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        # Python 工程根在 backend/（仓库根是 monorepo 组装点，不放工程配置）
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        # 测试横跨 db / crawler / web 三层，必须把它们都装上：
        # 只装 .[dev] 的话，test_repository（sqlalchemy）、test_static_html（bs4）、
        # 以及 web 路由测试都会在收集阶段就 ImportError。
        run: pip install -e ".[dev,web,db,crawler]"

      - name: 格式检查
        run: ruff format --check .

      - name: 静态检查
        run: ruff check .

      - name: 类型检查
        run: pyright

      - name: 测试
        run: pytest
