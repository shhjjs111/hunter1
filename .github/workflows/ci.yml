name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    name: 质量门禁（后端 + 前端 + 契约）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装后端依赖
        # 测试横跨 db / crawler / 各切片三层，必须把它们都装上：
        # 只装 .[dev] 的话，test_repository（sqlalchemy）、test_adapters（bs4）
        # 以及各切片的路由测试都会在收集阶段就 ImportError。
        run: pip install -e ".[dev,web,db,crawler]"
        working-directory: backend

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 安装 shellcheck
        # check.sh 会跑 shellcheck 查 shell 脚本的语义级缺陷（bash -n 只查语法）。
        # 未装时 check.sh 会明确提示并跳过（不是静默跳过）—— 但**不装就等于没强制**，
        # 所以这里保证它在 CI 上存在。镜像通常已预装，仅在缺失时才 apt 装。
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      - name: 全量门禁（ruff / pyright / pytest / 示例 / shellcheck / 前端 check+build / 契约漂移）
        # 直接调用本地同款脚本 —— CI 与开发机不可能再漂移。
        # 之前这里手写后端五步，漏了前端 `npm run check` 与 `contracts.sh --check`：
        # 「后端改了 API 模型忘了重跑 contracts.sh」能一路绿灯合入，契约静默断开。
        # check.sh 按目录存在性自动纳入各端检查，新增端时无需再改本文件。
        run: bash scripts/check.sh
