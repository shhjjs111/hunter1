[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter1"
version = "0.0.1"
description = "求职工作台：轻量 · 跨平台 · 零托管"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Web UI：FastAPI + 服务端模板（jinja2）+ 表单解析（python-multipart）。
# uvicorn 不取 [standard]：那是给生产部署用的加速件，本地单用户工具用不上，
# 且在 Windows 上大部分装不了，徒增安装失败面。
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]
db = ["sqlalchemy>=2.0,<3"]
crawler = ["beautifulsoup4>=4.12", "lxml>=5.0"]
browser = ["playwright>=1.48"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1",
]

[project.scripts]
hunter1 = "hunter1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hunter1"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# `.rivet/` 是协作框架的本地工作区（会话备份、临时探针），不是项目源码；
# 它的内容会随会话变动，扫进来只会制造噪音。
extend-exclude = [".rivet"]

[tool.ruff.lint]
# 基础规则集：错误/未用导入/导入排序/命名/现代语法/bugbear/简化/Ruff 专有
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 = "歧义 Unicode 字符"（形近字符混用），本意是防英文里的
# 全角/形近字符误用。本项目注释与文档为中文，全角标点是有意使用，故忽略。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 允许不安装即可从 src 导入（配合 `pip install -e .` 双保险）；"." 让 tests 包可导入
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/hunter1"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
