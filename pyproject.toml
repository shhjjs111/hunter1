[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunter1"
version = "0.0.1"
description = "求职工作台：轻量 · 跨平台 · 零托管"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
db = ["sqlalchemy>=2.0,<3"]
crawler = ["beautifulsoup4>=4.12", "lxml>=5.0"]
browser = ["playwright>=1.48"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hunter1"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# 基础规则集：错误/未用导入/导入排序/命名/现代语法/bugbear/简化/Ruff 专有
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 = "歧义 Unicode 字符"（形近字符混用），本意是防英文里的
# 全角/形近字符误用。本项目注释与文档为中文，全角标点是有意使用，故忽略。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 允许不安装即可从 src 导入（配合 `pip install -e .` 双保险）
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/hunter1"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
